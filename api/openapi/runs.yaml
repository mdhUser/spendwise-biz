openapi: 3.1.0
info:
  title: SpendWise Runs API
  version: 0.1.0
  description: |
    M3 asynchronous substitution runs. `POST /v1/runs` validates and enqueues a
    MySQL `async_jobs` row in the same transaction as the user message and
    `conv_search_runs` row, then returns 202. `spendwise-worker` claims jobs with
    `FOR UPDATE SKIP LOCKED`, completes them idempotently, and the SSE endpoint
    polls the run row to emit `snapshot`, `progress`, `result` and `error`.

    The 45-second synchronous orchestration is no longer the only path.
servers:
  - url: /
tags:
  - name: runs
paths:
  /v1/runs:
    post:
      tags: [runs]
      operationId: createRun
      description: Create a run (202). Replays return 200 + Idempotent-Replay.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRunInput" }
      responses:
        "202":
          description: Accepted and queued
          headers:
            Location: { schema: { type: string, example: /v1/runs/01J... } }
            RateLimit-Limit: { schema: { type: integer } }
            RateLimit-Remaining: { schema: { type: integer } }
            RateLimit-Reset: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "200":
          description: Idempotent replay
          headers:
            Idempotent-Replay: { schema: { type: string, const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404":
          description: Conversation not found/not owned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Idempotency mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited (60 runs per 24h)
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Queue not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      tags: [runs]
      operationId: getRun
      responses:
        "200":
          description: Run status, reply and assessments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/runs/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    post:
      tags: [runs]
      operationId: cancelRun
      description: |
        Idempotent. Cancels the run and its queued/running async_jobs row; a
        terminal run is returned unchanged.
      responses:
        "200":
          description: Run after cancellation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/runs/{id}/events:
    parameters: [{ $ref: "#/components/parameters/PathID" }]
    get:
      tags: [runs]
      operationId: streamRunEvents
      description: |
        Server-Sent Events. Emits `snapshot` immediately, `progress` while the
        worker runs, then `result` (or `error`) and closes. Heartbeat comment
        every 15s; `retry: 3000`. Disconnecting does not cancel the job.
      responses:
        "200":
          description: SSE stream
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Accel-Buffering: { schema: { type: string, const: "no" } }
          content:
            text/event-stream:
              schema:
                type: string
                examples:
                  snapshot:
                    value: |
                      retry: 3000

                      event: snapshot
                      data: {"id":"01J...","status":"queued","assessments":[]}
                  progress:
                    value: |
                      event: progress
                      data: {"runId":"01J...","status":"running","elapsedMs":3200}
                  result:
                    value: |
                      event: result
                      data: {"id":"01J...","status":"succeeded","assessments":[...]}
        "404": { $ref: "#/components/responses/NotFound" }
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    PathID:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    NotFound:
      description: Not found or not owned by the caller
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    CreateRunInput:
      type: object
      required: [conversationId, message]
      properties:
        conversationId: { type: string, format: uuid }
        message: { type: string, minLength: 1, maxLength: 4000 }
        sourceSkuId: { type: string, format: uuid }
        candidateSkuIds:
          type: array
          maxItems: 20
          items: { type: string, format: uuid }
    Run:
      type: object
      required: [id, conversationId, status, reply, startedAt, assessments]
      properties:
        id: { type: string, format: uuid }
        jobId:
          type: string
          format: uuid
          description: Only present on the create response.
        conversationId: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        reply: { type: string }
        error: { type: string }
        sourceSkuId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        assessments:
          type: array
          items: { $ref: "#/components/schemas/Assessment" }
    Assessment:
      type: object
      required: [id, verdict, reason, costBreakdown]
      properties:
        id: { type: string, format: uuid }
        candidateSkuId: { type: string, format: uuid }
        verdict: { type: string, enum: [equivalent, alternative, not_substitute, unknown] }
        reason: { type: string }
        costBreakdown:
          type: object
          description: |
            Integer fen fields. sourceTotalFen/candidateTotalFen/savingFen are
            null when price or shipping is unknown; unknown is never 0.
          additionalProperties: true
