services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: spendwise_biz
      MYSQL_USER: biz_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  biz-migrate:
    build: .
    command: ["/app/migrate"]
    env_file:
      - .env
    environment:
      BIZ_MYSQL_DSN: biz_app:${MYSQL_APP_PASSWORD}@tcp(db:3306)/spendwise_biz?parseTime=true&loc=UTC
    depends_on:
      db:
        condition: service_healthy

  biz:
    build: .
    env_file:
      - .env
    environment:
      BIZ_HTTP_ADDR: 0.0.0.0:8080
      BIZ_MYSQL_DSN: biz_app:${MYSQL_APP_PASSWORD}@tcp(db:3306)/spendwise_biz?parseTime=true&loc=UTC
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      biz-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mysql_data:
